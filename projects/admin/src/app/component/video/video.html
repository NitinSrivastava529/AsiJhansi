<div class="container-fluid">
    <!-- row opened -->
    <div class="row">
        <div class="col-md-5 col-lg-5 col-xl-5">
            <div class="card card-table">
                <div class=" card-header p-0 d-flex justify-content-between">
                    <h4 class="card-title mb-1">Manage Videos</h4>                  
                </div>
                <span class="fs-12 text-muted mb-3 ">This is about video images.</span>
                <div class="row g-3">
                    <div class="section-title mb-3">Upload Videos</div>
                    <div class="search-card m-0 col-md-12" style="display: flex;">
                        <div class="-" style="margin-left: 10px;">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-camera text-primary-color"></i>
                                </span>
                                   <input type="text" #fileInput class="form-control" placeholder="Youtube Video Code" />
                                <button type="button" class="btn btn-success btn-sm" (click)="AddVideo(fileInput.value)">
                                    <i class="bi bi-upload me-2"></i> Upload
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3" style="margin-top: 10px;">                   
                    <div class="col-sm-12">
                        <div class="table-responsive country-table" style="max-height: 360px;overflow: auto;">
                            <table class="table table-responsive table-bordered mb-0 text-nowrap">
                                <thead>
                                    <tr>
                                        <th class="wd-lg-25p">Videos <span style="font-size: 12px; color: red;float: right;">Total :  {{ gallery.length }}</span></th>
                                        <th class="wd-lg-25p w1">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    @for (item of gallery; track $index) {
                                    <tr>
                                        <td>
                                              <iframe  [src]="getYoutubeUrl(item.path)" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
                                    </iframe>
                                        </td>
                                        <td>
                                            <button class="btn btn-danger btn-sm" (click)="Delete(item.autoId)"><i class="fa fa-trash">&nbsp;</i></button>&nbsp;
                                        </td>
                                    </tr>
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
