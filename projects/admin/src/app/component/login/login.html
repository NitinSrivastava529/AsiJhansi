<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-4">
        <img src="./logo/logo_trans.png" />    
        <p class="text-muted small">Sign in to your account</p>
      </div>

      <div>
        <!-- Type -->
        <!-- <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-users"></i></span>
            <select class="form-control" #ddlRole [(ngModel)]="obj.type">
              <option value="-">Select User Type</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Branch Manager</option>
              <option value="AsstManager">Assistant Branch Manager</option>
            </select>
          </div>
        </div> -->
        <!-- Email -->
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-user"></i></span>
            <input type="email" class="form-control" [(ngModel)]="obj.staffId" placeholder="Enter User Id" required>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-lock"></i></span>
            <input type="password" id="password" [(ngModel)]="obj.password" class="form-control" placeholder="••••••••"
              required>
            <span class="input-group-text" id="togglePassword">
              <i class="fa fa-eye"></i>
            </span>
          </div>
        </div>

        <!-- Options -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#" class="small">Forgot password?</a>
        </div>

        <!-- Button -->
        @if(!loading){
        <button  type="submit" class="btn btn-login w-100 py-2" (click)="login()"
          [disabled]="(obj.staffId=='' || obj.password=='')">
          <i class="fa fa-sign-in-alt me-2"></i> Login 
        </button>
        }
        @else {
        <label><img style="width: 30px;" src="/logo/loading.gif" /></label>
        }
      </div>

      <!-- <div class="text-center mt-4 small text-muted">
        <b>Developed By : </b>KNS Technology
      </div> -->
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Show/Hide Password
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = password.type === 'password' ? 'text' : 'password';
      password.type = type;
      togglePassword.innerHTML =
        type === 'password'
          ? '<i class="fa fa-eye"></i>'
          : '<i class="fa fa-eye-slash"></i>';
    });
  </script>

</body>

</html>
